[package]
name = "coffee-filter-core"
version = "0.1.1"
edition = "2024"

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
base64 = "0.22"
getrandom = "0.4"
http-body-util = "0.1"
hudsucker = { version = "0.25", features = ["rcgen-ca", "rustls-client", "decoder", "http2"], default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = { version = "1.0.1", features = ["std"] }
sha2 = "0.10"
socket2 = "0.6"
time = "0.3.55"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "signal", "sync"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# Win32_System_Registry is needed by SHELLEXECUTEINFOW (its hkeyClass field), not for registry access
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinInet", "Win32_Networking_WinSock", "Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
x509-parser = "0.18"

[build-dependencies]
# Puts the coffee icon (and version info) into coffee-filter-core.exe
winresource = "0.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
